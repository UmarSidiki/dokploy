name: Build and Push Dokploy Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm   # native arm64 runner — no QEMU, node-gyp compiles for real
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create empty .env.production
        run: touch .env.production

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/umarsidiki/dokploy-custom:latest
            ghcr.io/umarsidiki/dokploy-custom:sha-${{ github.sha }}