name: Build and Push Dokploy Image

on:
  push:
    branches: [canary, main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/umarsidiki/dokploy-custom

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dokploy-image
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute fork version
        id: v
        run: |
          BASE=$(node -p "require('./apps/dokploy/package.json').version")
          echo "version=${BASE}-fork.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  docker-amd64:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Stamp fork version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "const f='apps/dokploy/package.json',p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest-amd64
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64

  docker-arm64:
    needs: version
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Stamp fork version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "const f='apps/dokploy/package.json',p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest-arm64
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64

  combine-manifests:
    needs: [version, docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create -t ${IMAGE_NAME}:latest \
            ${IMAGE_NAME}:latest-amd64 \
            ${IMAGE_NAME}:latest-arm64

          docker buildx imagetools create -t ${IMAGE_NAME}:${VERSION} \
            ${IMAGE_NAME}:latest-amd64 \
            ${IMAGE_NAME}:latest-arm64

          docker buildx imagetools create -t ${IMAGE_NAME}:sha-${GITHUB_SHA} \
            ${IMAGE_NAME}:sha-${GITHUB_SHA}-amd64 \
            ${IMAGE_NAME}:sha-${GITHUB_SHA}-arm64
